<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>SMART RACK &middot; Inventory System</title>
    <style>
        :root {
            --bg: #f4f7fc;
            --surface: #ffffff;
            --surface2: #f8fafc;
            --border: #e2e8f0;
            --text: #1e293b;
            --text2: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        body.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface2: #334155;
            --border: #475569;
            --text: #f8fafc;
            --text2: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            padding: 1.5rem;
            min-height: 100vh;
            transition: background 0.2s, color 0.2s;
        }

        .wrap {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Top Header */
        .hdr {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .hdr h1 {
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
        }

        .hdr-r {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .srch {
            position: relative;
            min-width: 220px;
        }

        .srch input {
            width: 100%;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text);
            outline: none;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .srch input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .ac {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--surface);
            border-radius: 16px;
            border: 1.5px solid var(--border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            max-height: 260px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
        }

        .ac-item {
            padding: 0.65rem 1rem;
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ac-item:hover {
            background: var(--surface2);
        }

        .dk {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .dk:hover {
            transform: scale(1.08);
        }

        /* Top Page Navigation Bar */
        .page-nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 0.5rem;
            margin-bottom: 1.2rem;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            background: var(--surface2);
            padding: 4px;
            border-radius: 14px;
        }

        .nav-tab-btn {
            padding: 0.55rem 1.2rem;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text2);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-tab-btn.active {
            background: var(--surface);
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        body.dark .nav-tab-btn.active {
            background: var(--accent);
            color: white;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-p {
            background: var(--accent);
            color: white;
        }

        .btn-p:hover {
            background: var(--accent-hover);
        }

        .btn-o {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text);
        }

        .btn-o:hover {
            background: var(--surface2);
        }

        .btn-sm {
            padding: 0.3rem 0.75rem;
            font-size: 0.78rem;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* Side-by-Side Desktop Layout */
        .main-layout {
            display: flex;
            gap: 1.8rem;
            align-items: flex-start;
        }

        .rack-pane {
            flex: 0 0 380px;
            position: sticky;
            top: 1rem;
        }

        .inv-pane {
            flex: 1;
            min-width: 0;
        }

        .rack {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 1.2rem;
            box-shadow: var(--shadow);
        }

        .rack-hdr {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .rack-hdr h2 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .led-badge {
            font-size: 0.8rem;
            background: var(--surface2);
            padding: 0.25rem 0.8rem;
            border-radius: 30px;
            color: var(--text2);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid var(--border);
        }

        .led-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .led-dot.on {
            background: var(--accent);
            box-shadow: 0 0 9px var(--accent);
        }

        .rack-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .rc {
            height: 56px;
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text2);
            cursor: pointer;
            transition: 0.2s;
        }

        .rc .rc-led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e1;
            margin-bottom: 2px;
        }

        .rc.act {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.12);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            transform: scale(1.03);
            color: var(--text);
        }

        .rc.act .rc-led {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .inv-hdr {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .inv-hdr h2 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .inv-act {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .cnt {
            background: var(--surface2);
            border: 1.5px solid var(--border);
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text2);
        }

        .cats {
            display: flex;
            gap: 0.45rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .cp {
            padding: 0.25rem 0.85rem;
            border-radius: 40px;
            font-size: 0.78rem;
            font-weight: 600;
            border: 1.5px solid var(--border);
            background: var(--surface2);
            color: var(--text2);
            cursor: pointer;
            transition: 0.15s;
        }

        .cp.on {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 1rem;
        }

        .card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 1rem 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: var(--shadow);
            transition: 0.15s;
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.08);
        }

        .cn {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ctag {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: var(--surface2);
            padding: 0.15rem 0.55rem;
            border-radius: 30px;
            color: var(--text2);
            font-weight: 600;
        }

        .ci {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            font-size: 0.84rem;
            color: var(--text2);
        }

        .low {
            background: #fee2e2;
            color: #b91c1c;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.12rem 0.5rem;
            border-radius: 20px;
        }

        body.dark .low {
            background: #450a0a;
            color: #fca5a5;
        }

        .ca {
            display: flex;
            gap: 0.4rem;
            justify-content: flex-end;
            margin-top: 0.2rem;
        }

        /* Storage Hierarchy Manager Dedicated View */
        .hierarchy-page {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .box-unit {
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 0.6rem 0.85rem;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 52px;
        }

        .box-unit:hover {
            border-color: var(--accent);
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 14px;
        }

        .slot-card {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 130px;
        }

        .dim-badge {
            font-size: 0.72rem;
            font-weight: 700;
            background: var(--surface2);
            color: var(--accent);
            padding: 0.2rem 0.55rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .cap-bar-wrap {
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 0.9rem 1.1rem;
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .cap-progress {
            height: 10px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        body.dark .cap-progress {
            background: #334155;
        }

        .cap-fill {
            height: 100%;
            background: #3b82f6;
            border-radius: 10px;
            transition: width 0.3s;
        }

        /* Interactive 2D Drag & Draw Grid Canvas */
        .canvas-container {
            position: relative;
            width: 100%;
            height: 380px;
            background: var(--surface);
            border: 2.5px dashed var(--border);
            border-radius: 20px;
            overflow: hidden;
            user-select: none;
            touch-action: none;
            margin-bottom: 1.4rem;
            cursor: crosshair;
            box-shadow: inset 0 2px 12px rgba(0,0,0,0.06);
        }

        .canvas-grid-lines {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .drawn-slot {
            position: absolute;
            background: rgba(59, 130, 246, 0.22);
            border: 2px solid var(--accent);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--text);
            padding: 4px;
            transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
            cursor: pointer;
            overflow: hidden;
            text-align: center;
            z-index: 5;
        }

        .drawn-slot:hover {
            background: rgba(59, 130, 246, 0.38);
            border-color: #2563eb;
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.3);
            z-index: 15;
        }

        .drawn-slot.active-loc {
            border-color: #facc15;
            background: rgba(250, 204, 21, 0.35);
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
        }

        .drag-box {
            position: absolute;
            background: rgba(16, 185, 129, 0.28);
            border: 2px dashed #10b981;
            border-radius: 8px;
            pointer-events: none;
            z-index: 20;
        }

        /* Modal Overlay */
        .ov {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 1rem;
        }

        .ov.open {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border-radius: 24px;
            padding: 2rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
            max-height: 90vh;
            overflow-y: auto;
            color: var(--text);
            border: 1.5px solid var(--border);
        }

        .modal h3 {
            font-size: 1.25rem;
            margin-bottom: 1.2rem;
            font-weight: 700;
        }

        .fg {
            margin-bottom: 0.9rem;
        }

        .fg label {
            display: block;
            font-size: 0.83rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .fg input, .fg select {
            width: 100%;
            padding: 0.65rem 0.9rem;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.92rem;
            background: var(--surface);
            color: var(--text);
            outline: none;
            transition: 0.2s;
        }

        .fg input:focus, .fg select:focus {
            border-color: var(--accent);
        }

        .mr {
            display: flex;
            gap: 0.7rem;
        }

        .mr .fg {
            flex: 1;
        }

        .mb {
            display: flex;
            gap: 0.7rem;
            justify-content: flex-end;
            margin-top: 1.3rem;
        }

        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 0.6rem 1.6rem;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            opacity: 0;
            pointer-events: none;
            z-index: 3000;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        body.dark #toast {
            background: #e2e8f0;
            color: #0f172a;
        }

        #toast.show {
            opacity: 1;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 260px;
            min-height: 200px;
            max-height: 380px;
            resize: vertical;
            overflow: hidden;
            background: var(--surface2);
            border: 2px dashed var(--border);
            border-radius: 18px;
            box-sizing: border-box;
            user-select: none;
            touch-action: none;
        }

        .canvas-container::-webkit-resizer {
            background-color: var(--accent);
            border-radius: 4px;
        }

        .comp-stack-pane {
            flex: 0 0 135px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 1rem 0.75rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            height: fit-content;
        }

        .comp-bay {
            width: 100%;
            height: 85px;
            border: 2px dashed var(--border);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text2);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            background: var(--surface2);
            user-select: none;
        }

        .comp-bay:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .comp-bay.glowing-active {
            background: radial-gradient(circle, #fff7ed 0%, #facc15 60%, #eab308 100%) !important;
            border: 3.5px solid #facc15 !important;
            box-shadow: 0 0 32px rgba(250, 204, 21, 0.95), inset 0 0 18px #ffffff !important;
            color: #000000 !important;
            transform: scale(1.05);
            z-index: 10;
        }

        @media(max-width: 950px) {
            .main-layout {
                flex-direction: column;
            }
            .rack-pane, .comp-stack-pane {
                flex: none;
                width: 100%;
                position: static;
            }
            .comp-stack-pane {
                flex-direction: row;
                height: auto;
            }
            .comp-bay {
                height: 70px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div id="toast"></div>

        <!-- Add / Edit Item Modal -->
        <div class="ov" id="addEditModal">
            <div class="modal">
                <h3 id="mtitle">Add New Item</h3>
                <div class="fg"><label>Item Name *</label><input id="fn" placeholder="e.g. Resistor 1kΩ"></div>
                <div class="fg">
                    <label>Category</label>
                    <select id="fc">
                        <option value="Electronics">Electronics</option>
                        <option value="Resistor">Resistor</option>
                        <option value="Capacitors">Capacitors</option>
                        <option value="Active">Active</option>
                        <option value="Passive">Passive</option>
                        <option value="Connectors">Connectors</option>
                        <option value="PCB">PCB</option>
                        <option value="Debuggers">Debuggers</option>
                        <option value="Cables">Cables</option>
                        <option value="General Items">General Items</option>
                    </select>
                </div>
                <div class="fg"><label>Quantity</label><input id="fq" type="number" min="0" value="1"></div>
                <div class="fg" style="display:flex;align-items:center;gap:.5rem;">
                    <input id="fns" type="checkbox" onchange="toggleNonSmart(this.checked)" style="width:auto;cursor:pointer;">
                    <label for="fns" style="margin-bottom:0;cursor:pointer;">Non-smart item (Disable LEDs)</label>
                </div>
                <div class="fg" style="display:flex;align-items:center;gap:.5rem;">
                    <input id="fret" type="checkbox" style="width:auto;cursor:pointer;">
                    <label for="fret" style="margin-bottom:0;cursor:pointer;">Returnable Item (Meter / Tool)</label>
                </div>
                <div class="mr">
                    <div class="fg"><label>Shelf</label><select id="fshelf" onchange="onFormShelfChange(this.value)"></select></div>
                    <div class="fg"><label>Compartment</label><select id="fcomp" onchange="onFormCompChange(this.value)"></select></div>
                </div>
                <div class="mr">
                    <div class="fg"><label>Box Container</label><select id="fbox" onchange="onFormBoxChange(this.value)"></select></div>
                    <div class="fg" id="fslWrap"><label>Slot No.</label><select id="fsl"></select></div>
                </div>

                <div class="mb">
                    <button class="btn btn-o" onclick="closeAddEditModal()">Cancel</button>
                    <button class="btn btn-p" onclick="saveItem()">Save Item</button>
                </div>
            </div>
        </div>

        <!-- Add Element Modal (Shelf / Compartment / Box / Slot) -->
        <div class="ov" id="elemModal">
            <div class="modal">
                <h3 id="elemModalTitle">Add New Element</h3>
                <div class="fg">
                    <label id="elemModalLabel">Element Name</label>
                    <input id="elemNameInput" placeholder="e.g. Shelf 2 or Box 1">
                </div>
                <div id="elemShapeWrap" class="fg" style="display:none;">
                    <label>Compartment Shape</label>
                    <select id="elemShapeInput" style="padding:0.6rem 1rem; border-radius:12px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); font-weight:600;">
                        <option value="rect-h">▭ Rectangle (Horizontal / Wide)</option>
                        <option value="rect-v">▯ Rectangle (Vertical / Tall)</option>
                        <option value="square">🔲 Square</option>
                    </select>
                </div>
                <div id="elemGridPosWrap" class="mr" style="display:none; gap:0.5rem; margin-top:0.6rem;">
                    <div class="fg" style="flex:1;">
                        <label>Grid Row (1-3)</label>
                        <input id="elemGridRowInput" type="number" min="1" max="3" value="1">
                    </div>
                    <div class="fg" style="flex:1;">
                        <label>Grid Column (1-4)</label>
                        <input id="elemGridColInput" type="number" min="1" max="4" value="1">
                    </div>
                </div>
                <div id="dimWrap" class="mr" style="display:none;">
                    <div class="fg">

    <script>
        (function () {
            var GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5ThwS5c4_pBSocc0TUJWiPAgoQv0nGwB11OkD-PwcGPrCyDMZyzLKE4XORYNtrpWouw/exec';
            var items = [];
            var activeId = null;
            var srch = '';
            var activeCat = 'All';
            var selectedRackBox = 0;
            var selectedHShelf = 'Shelf 1';
            var selectedHComp = 'A';
            var selectedHBox = null;
            var editingItemId = null;
            var locateItemData = null;
            var currentPage = 'main';

            // Element Modal State
var elemModalType = ''; // 'shelf', 'comp', 'box', 'slot'
            var pendingDrawnSlotCoords = null; // { x, y, w, l }

            // Drag State for Canvas
            var isCanvasDragging = false;
            var dragStartGridX = 0;
            var dragStartGridY = 0;

            // Storage Structure Registry
            var structRegistry = {
                shelves: [
                    { name: 'Shelf 1' }
                ],
                compartments: {
                    'Shelf 1': []
                },
                boxes: {},
                slots: {}
            };

            // Helpers for Shelf, Compartment, Box, and Slot Objects
            function getBoxNum(val) {
                if (val === undefined || val === null) return 1;
                if (typeof val === 'number') return val;
                var str = String(val);
                var num = parseInt(str.replace(/[^0-9]/g, ''), 10);
                return isNaN(num) || num <= 0 ? 1 : num;
            }

            function getSlotNum(val) {
                if (val === undefined || val === null) return 1;
                if (typeof val === 'number') return val;
                var str = String(val);
                var num = parseInt(str.replace(/[^0-9]/g, ''), 10);
                return isNaN(num) || num <= 0 ? 1 : num;
            }

            function getShelfObj(sh) {
                if (typeof sh === 'string') return { name: sh, w: 100, l: 40 };
                return {
                    name: sh.name || 'Shelf 1',
                    w: Number(sh.w || 100),
                    l: Number(sh.l || 40)
                };
            }

            function cleanCompNameJS(val) {
                var s = String(val || '').trim().toUpperCase();
                var match = s.match(/(?:COMPARTMENT|COMP)\s*([A-Z])/i);
                if (match) return match[1];
                if (s.length === 1 && s >= 'A' && s <= 'Z') return s;
                if (s === '1' || s === '3') return 'A';
                if (s === '2' || s === '4') return 'B';
                return s || 'A';
            }

            function getCompObj(co, idx) {
                var rawName = typeof co === 'string' ? co : (co.name || 'A');
                var name = cleanCompNameJS(rawName);
                var defaultY = (name === 'B') ? 50 : (name === 'C' ? 25 : (name === 'D' ? 75 : 0));
                if (typeof co === 'string') {
                    return { name: name, x: 0, y: defaultY, w: 98, h: 45 };
                }
                var x = co.x !== undefined ? Number(co.x) : 0;
                var y = co.y !== undefined ? Number(co.y) : defaultY;
                var w = co.w !== undefined ? Number(co.w) : 98;
                var h = co.h !== undefined ? Number(co.h) : 45;
                return {
                    name: name,
                    x: Math.max(0, Math.min(100, x)),
                    y: Math.max(0, Math.min(100, y)),
                    w: Math.max(5, Math.min(100, w)),
                    h: Math.max(5, Math.min(100, h))
                };
            }

            function getBoxSpecJS(boxNum) {
                var b = parseInt(boxNum, 10) || 1;
                if (b >= 1 && b <= 10) {
                    return { w: 33, l: 15, slotsCount: 33, rows: 11, cols: 3, slotW: 11, slotL: 1.36 };
                } else if (b === 11 || b === 12) {
                    return { w: 20, l: 10, slotsCount: 4, rows: 2, cols: 2, slotW: 10, slotL: 5 };
                } else if (b >= 13 && b <= 15) {
                    return { w: 18, l: 10, slotsCount: 6, rows: 2, cols: 3, slotW: 6, slotL: 5 };
                } else if (b === 16 || b === 17) {
                    return { w: 12, l: 21, slotsCount: 28, rows: 7, cols: 4, slotW: 3, slotL: 3 };
                } else {
                    return { w: 30, l: 20, slotsCount: 1, rows: 1, cols: 1, slotW: 30, slotL: 20 };
                }
            }

            function getBoxSpecFromData(boxNum) {
                var bNum = getBoxNum(boxNum);
                var specDefault = getBoxSpecJS(bNum);
                var boxObj = null;
                var slotsList = [];

                if (structRegistry) {
                    if (structRegistry.boxes) {
                        Object.keys(structRegistry.boxes).forEach(function(bKey) {
                            var list = structRegistry.boxes[bKey] || [];
                            var found = list.find(function(b) {
                                var bName = typeof b === 'string' ? b : (b ? b.name : '');
                                return getBoxNum(bName) === bNum;
                            });
                            if (found) {
                                var wVal = typeof found === 'object' ? Number(found.w || 0) : 0;
                                var lVal = typeof found === 'object' ? Number(found.l || 0) : 0;
                                if (wVal > 0 && lVal > 0) {
                                    boxObj = { name: 'Box ' + bNum, boxNum: bNum, w: wVal, l: lVal };
                                }
                            }
                        });
                    }
                    if (structRegistry.slots) {
                        Object.keys(structRegistry.slots).forEach(function(sKey) {
                            var parts = sKey.split('->');
                            var lastPart = parts[parts.length - 1] || sKey;
                            if (getBoxNum(lastPart) === bNum) {
                                if (Array.isArray(structRegistry.slots[sKey]) && structRegistry.slots[sKey].length > 0) {
                                    if (structRegistry.slots[sKey].length > slotsList.length) {
                                        slotsList = structRegistry.slots[sKey];
                                    }
                                }
                            }
                        });
                    }
                }

                var w = boxObj ? boxObj.w : specDefault.w;
                var l = boxObj ? boxObj.l : specDefault.l;
                var slotsCount = slotsList.length || specDefault.slotsCount;
                var slotW = 0;
                var slotL = 0;

                if (slotsList.length > 0) {
                    var firstSlot = slotsList[0];
                    if (typeof firstSlot === 'object' && firstSlot.w && firstSlot.l) {
                        slotW = Number(firstSlot.w || 0);
                        slotL = Number(firstSlot.l || 0);
                    }
                } else {
                    slotW = specDefault.slotW;
                    slotL = specDefault.slotL;
                }

                var cols = (slotW > 0 && w > 0) ? Math.max(1, Math.round(w / slotW)) : (specDefault.cols || 3);
                var rows = cols > 0 ? Math.ceil(slotsCount / cols) : 0;
                return {
                    boxNum: bNum,
                    name: 'Box ' + bNum,
                    w: w,
                    l: l,
                    slotsCount: slotsCount,
                    rows: rows,
                    cols: cols,
                    slotW: slotW,
                    slotL: slotL
                };
            }

            function getBoxObj(b) {
                var rawName = typeof b === 'string' ? b : (b ? b.name : 'Box 1');
                var bNum = getBoxNum(rawName || (b ? b.boxNum : 1));
                return getBoxSpecFromData(bNum);
            }

            function getSlotObj(s) {
                if (typeof s === 'string') return { name: s, x: 0, y: 0, w: 10, l: 10 };
                return {
                    name: s.name || 'Slot 1',
                    x: Number(s.x || 0),
                    y: Number(s.y || 0),
                    w: Number(s.w || 10),
                    l: Number(s.l || 10)
                };
            }

            var structureLoadedFromSheet = false;
            var structureSaveInProgress = false;
            var sheetRequestId = 0;

            function normalizeStructure(structure) {
                var normalized = { shelves: structure.shelves || [], compartments: structure.compartments || {}, boxes: {}, slots: {} };
                ['boxes', 'slots'].forEach(function(type) {
                    Object.keys(structure[type] || {}).forEach(function(key) {
                        normalized[type][key.toLowerCase()] = structure[type][key];
                    });
                });
                return normalized;
            }

            function cacheStructure() {
                try { localStorage.setItem('smartrack_structure_v5', JSON.stringify(structRegistry)); } catch(e) {}
            }

            function readSheetData() {
                var url = GOOGLE_SCRIPT_URL + '?t=' + Date.now();
                return fetch(url, { mode: 'cors', cache: 'no-store' }).then(function(response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                }).catch(function() {
                    return new Promise(function(resolve, reject) {
                        var callback = 'sheetRead_' + (++sheetRequestId);
                        var script = document.createElement('script');
                        var timer = setTimeout(function() { finish(new Error('Cloud request timed out')); }, 20000);
                        function finish(error, data) {
                            clearTimeout(timer);
                            delete window[callback];
                            script.remove();
                            if (error) reject(error); else resolve(data);
                        }
                        window[callback] = function(data) { finish(null, data); };
                        script.onerror = function() { finish(new Error('Could not connect to Cloud')); };
                        script.src = url + '&callback=' + callback;
                        document.head.appendChild(script);
                    });
                });
            }

            function structureSignature(structure) {
                function stable(value) {
                    if (Array.isArray(value)) return value.map(stable).sort(function(a, b) {
                        return JSON.stringify(a).localeCompare(JSON.stringify(b));
                    });
                    if (value && typeof value === 'object') {
                        var result = {};
                        Object.keys(value).sort().forEach(function(key) { result[key] = stable(value[key]); });
                        return result;
                    }
                    return value;
                }
                return JSON.stringify(stable(normalizeStructure(structure)));
            }

            function saveStructure(toSheet) {
                if (!toSheet) { cacheStructure(); return Promise.resolve(true); }
                if (!structureLoadedFromSheet || structureSaveInProgress) {
                    toast('Wait for the cloud to finish loading or saving.');
                    return Promise.resolve(false);
                }
                structureSaveInProgress = true;
                var snapshot = JSON.parse(JSON.stringify(structRegistry));
                var signature = structureSignature(snapshot);
                showSyncOverlay('Saving layout to the cloud. Please wait for confirmation...');
                // This existing endpoint changes Structure!A2 only; inventory rows are untouched.
                return fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ type: 'structure', data: snapshot })
                }).then(function() {
                    function verify(attempts) {
                        return readSheetData().then(function(data) {
                            if (data && data.structure && structureSignature(data.structure) === signature) return data;
                            if (attempts <= 1) throw new Error('The cloud has not confirmed this layout. Check the cloud connection and try saving again.');
                            return new Promise(function(resolve) { setTimeout(resolve, 1200); }).then(function() { return verify(attempts - 1); });
                        });
                    }
                    return verify(3);
                }).then(function(data) {
                    window.handleGoogleSheetsData(data);
                    toast('Layout saved and verified in the cloud.');
                    return true;
                }).catch(function(error) {
                    toast('Layout not confirmed saved: ' + error.message + ' Keep this page open and retry the change.');
                    return false;
                }).finally(function() {
                    structureSaveInProgress = false;
                    hideSyncOverlay();
                });
            }

            var dark = localStorage.getItem('smartrack_dark') === 'true' ||
                (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

            if (dark) document.body.classList.add('dark');
            updDk(); if (typeof isESP !== "undefined" && isESP) { var espBtns = document.querySelectorAll(".esp-only-btn"); espBtns.forEach(function(b){ b.style.display="inline-block"; }); var p = document.getElementById("connStatusPill"); if (p) { p.innerHTML = "&#128230; ESP Local Storage Connected"; p.style.background="#e0f2fe"; p.style.color="#0369a1"; p.style.borderColor="#7dd3fc"; } } if (typeof isESP !== "undefined" && isESP) { var espBtns = document.querySelectorAll(".esp-only-btn"); espBtns.forEach(function(b){ b.style.display="inline-block"; }); var p = document.getElementById("connStatusPill"); if (p) { p.innerHTML = "&#128230; ESP Local Storage Connected"; p.style.background="#e0f2fe"; p.style.color="#0369a1"; p.style.borderColor="#7dd3fc"; } }

            buildRackGrid();
            fetchInventory();

            function normalizeItem(raw) {
                var id = Number(raw.id || 0);
                var name = String(raw.name || raw.Name || raw.NAME || raw.Item || raw.item || raw.title || raw.description || raw.BOM || '').trim();
                if (!name) name = 'Unnamed Component';
                var category = String(raw.category || 'Electronics').trim();
                var catLower = category.toLowerCase();
                if (!category || catLower.indexOf('compartment') === 0 || catLower.indexOf('slot') === 0 || catLower.indexOf('box') === 0) {
                    category = 'Electronics';
                }
                var quantity = Number(raw.quantity || 0);
                var rawRow = Number(raw.row || 0);
                var rawCol = Number(raw.col || 0);

                var boxStr = String(raw.box || raw.boxNum || raw.boxnum || '1');
                var rawBoxNum = parseInt(boxStr.replace(/[^0-9]/g, '')) || 1;

                var subBoxStr = String(raw.subBox || raw.subbox || raw.slot || '1');
                var subBox = parseInt(subBoxStr.replace(/[^0-9]/g, '')) || 1;

                // The Cloud is the source of truth for physical location.
                // Never redistribute an item into another box based on its slot
                // number: this previously caused the apparent random placement.
                var boxNum = rawBoxNum;
                var slotNum = subBox;

                // Row and column also come from the Sheet.  Do not calculate
                // them from a locally hard-coded box layout.
                var row = rawRow;
                var col = rawCol;

                var isSmart = raw.isSmart !== undefined ? Boolean(raw.isSmart) : (row > 0 && col > 0);

                var shelf = String(raw.shelf || raw.location || (isSmart ? 'Shelf 1' : 'Main Rack')).trim();
                if (!shelf || shelf.toLowerCase() === 'smart rack') shelf = 'Shelf 1';

                var rawComp = String(raw.compartment || raw.section || 'A').trim().toUpperCase();
                var compartment = cleanCompNameJS(rawComp);


                var box = 'Box ' + boxNum;
                var slot = 'Slot ' + slotNum;

                return {
                    id: id,
                    name: name,
                    category: category,
                    quantity: quantity,
                    row: row,
                    col: col,
                    boxNum: boxNum,
                    subBox: slotNum,
                    isSmart: isSmart,
                    shelf: shelf,
                    compartment: compartment,
                    box: box,
                    slot: slot,
                    isReturnable: Boolean(raw.isReturnable),
                    borrower: String(raw.borrower || ''),
                    returnDate: String(raw.returnDate || ''),
                    borrowedQty: Number(raw.borrowedQty || 0)
                };
            }

            // Inventory may come from Cloud. Escape user-controlled text
            // before adding it to HTML.
            function escapeHtml(value) {
                return String(value === undefined || value === null ? '' : value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function syncItemsToStructure() {
                var beforeStr = JSON.stringify(structRegistry);

                if (!structRegistry.shelves || structRegistry.shelves.length === 0) {
                    structRegistry.shelves = [{ name: 'Shelf 1' }];
                }
                if (!structRegistry.compartments) structRegistry.compartments = {};
                if (!structRegistry.boxes) structRegistry.boxes = {};
                if (!structRegistry.slots) structRegistry.slots = {};

                // Purge any mistakenly added 'Slot X' or 'box X' entries from compartments registry
                Object.keys(structRegistry.compartments).forEach(function(shKey) {
                    if (Array.isArray(structRegistry.compartments[shKey])) {
                        var cleanedList = [];
                        structRegistry.compartments[shKey].forEach(function(c) {
                            var cName = (typeof c === 'string' ? c : (c.name || '')).trim().toUpperCase();
                            if (cName.indexOf('SLOT ') === 0 || cName.indexOf('BOX ') === 0) {
                                return;
                            }
                            var cleanN = cleanCompNameJS(cName);
                            var defaultY = (cleanN === 'B' ? 50 : (cleanN === 'C' ? 25 : (cleanN === 'D' ? 75 : 0)));
                            var xVal = (typeof c === 'object' && c.x !== undefined) ? Number(c.x) : 0;
                            var yVal = (typeof c === 'object' && c.y !== undefined) ? Number(c.y) : defaultY;
                            var wVal = (typeof c === 'object' && c.w !== undefined) ? Number(c.w) : 98;

            function initShelfCanvasDragEvents(shelfObj) {
                var cvs = document.getElementById('shelfCanvas');
                var gridBg = document.getElementById('shelfGridBg');
                var rb = document.getElementById('shelfDragRubberband');
                if (!cvs) return;

                var bgW = (100 / shelfObj.w);
                var bgL = (100 / shelfObj.l);
                gridBg.style.backgroundImage = 'linear-gradient(to right, rgba(16,185,129,0.18) 1px, transparent 1px), linear-gradient(to bottom, rgba(16,185,129,0.18) 1px, transparent 1px)';
                gridBg.style.backgroundSize = bgW + '% ' + bgL + '%';

                function getShelfGridCoords(e) {
                    var rect = cvs.getBoundingClientRect();
                    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    var relX = Math.min(rect.width, Math.max(0, clientX - rect.left));
                    var relY = Math.min(rect.height, Math.max(0, clientY - rect.top));

                    var gx = Math.floor((relX / rect.width) * shelfObj.w);
                    var gy = Math.floor((relY / rect.height) * shelfObj.l);
                    return { gx: Math.min(shelfObj.w - 1, Math.max(0, gx)), gy: Math.min(shelfObj.l - 1, Math.max(0, gy)) };
                }

                function onShelfPointerDown(e) {
                    if (e.target.classList.contains('drawn-slot')) return;
                    isCanvasDragging = true;
                    var coords = getShelfGridCoords(e);
                    dragStartGridX = coords.gx;
                    dragStartGridY = coords.gy;

                    updateShelfRubberband(coords.gx, coords.gy, coords.gx + 1, coords.gy + 1);
                    rb.style.display = 'block';
                }

                function onShelfPointerMove(e) {
                    if (!isCanvasDragging) return;
                    e.preventDefault();
                    var coords = getShelfGridCoords(e);
                    var endX = coords.gx >= dragStartGridX ? coords.gx + 1 : coords.gx;
                    var endY = coords.gy >= dragStartGridY ? coords.gy + 1 : coords.gy;
                    var startX = coords.gx >= dragStartGridX ? dragStartGridX : dragStartGridX + 1;
                    var startY = coords.gy >= dragStartGridY ? dragStartGridY : dragStartGridY + 1;

                    updateShelfRubberband(startX, startY, endX, endY);
                }

                function onShelfPointerUp(e) {
                    if (!isCanvasDragging) return;
                    isCanvasDragging = false;
                    rb.style.display = 'none';

                    var rect = cvs.getBoundingClientRect();
                    var clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                    var clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                    var relX = Math.min(rect.width, Math.max(0, clientX - rect.left));
                    var relY = Math.min(rect.height, Math.max(0, clientY - rect.top));

                    var endGridX = Math.min(shelfObj.w, Math.max(0, Math.round((relX / rect.width) * shelfObj.w)));
                    var endGridY = Math.min(shelfObj.l, Math.max(0, Math.round((relY / rect.height) * shelfObj.l)));

                    var x1 = Math.min(dragStartGridX, endGridX);
                    var y1 = Math.min(dragStartGridY, endGridY);
                    var x2 = Math.max(dragStartGridX, endGridX);
                    var y2 = Math.max(dragStartGridY, endGridY);

                    var compW = Math.max(1, x2 - x1);
                    var compL = Math.max(1, y2 - y1);

                    pendingDrawnSlotCoords = { x: x1, y: y1, w: compW, l: compL };
                    openAddDrawnCompModal(pendingDrawnSlotCoords);
                }

                function updateShelfRubberband(x1, y1, x2, y2) {
                    var minX = Math.min(x1, x2);
                    var minY = Math.min(y1, y2);
                    var maxX = Math.max(x1, x2);
                    var maxY = Math.max(y1, y2);

                    rb.style.left = ((minX / shelfObj.w) * 100) + '%';
                    rb.style.top = ((minY / shelfObj.l) * 100) + '%';
                    rb.style.width = (((maxX - minX) / shelfObj.w) * 100) + '%';
                    rb.style.height = (((maxY - minY) / shelfObj.l) * 100) + '%';
                }

                cvs.onmousedown = onShelfPointerDown;
                cvs.onmousemove = onShelfPointerMove;
                window.onmouseup = onShelfPointerUp;

                cvs.ontouchstart = onShelfPointerDown;
                cvs.ontouchmove = onShelfPointerMove;
                window.ontouchend = onShelfPointerUp;
            }

            function initCanvasResizeHandler() {
                var resizer = document.getElementById('shelfCanvasResizer');
                var canvas = document.getElementById('shelfCanvas');
                if (!resizer || !canvas) return;
                
                var startY, startHeight;
                
                function onPointerDown(e) {
                    startY = e.touches ? e.touches[0].clientY : e.clientY;
                    startHeight = parseInt(document.defaultView.getComputedStyle(canvas).height, 10);
                    document.addEventListener('pointermove', onPointerMove);
                    document.addEventListener('pointerup', onPointerUp);
                    e.preventDefault();
                }
                
                function onPointerMove(e) {
                    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    var dy = clientY - startY;
                    var newH = Math.max(300, Math.min(800, startHeight + dy));
                    canvas.style.height = newH + 'px';
                }
                
                function onPointerUp() {
                    document.removeEventListener('pointermove', onPointerMove);
                    document.removeEventListener('pointerup', onPointerUp);
                }
                
                resizer.onpointerdown = onPointerDown;
            }

            function initShelfCanvasDragEvents() {
                var canvas = document.getElementById('shelfCanvas');
                var rubberband = document.getElementById('shelfDragRubberband');
                if (!canvas || !rubberband) return;

                var isDragging = false;
                var startX = 0, startY = 0;

                canvas.onpointerdown = function(e) {
                    if (e.target !== canvas && e.target !== document.getElementById('shelfGridBg')) return;
                    isDragging = true;
                    var rect = canvas.getBoundingClientRect();
                    startX = e.clientX - rect.left;
                    startY = e.clientY - rect.top;

                    rubberband.style.left = startX + 'px';
                    rubberband.style.top = startY + 'px';
                    rubberband.style.width = '0px';
                    rubberband.style.height = '0px';
                    rubberband.style.display = 'block';

                    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
                };

                canvas.onpointermove = function(e) {
                    if (!isDragging) return;
                    var rect = canvas.getBoundingClientRect();
                    var currentX = e.clientX - rect.left;
                    var currentY = e.clientY - rect.top;

                    var left = Math.min(startX, currentX);
                    var top = Math.min(startY, currentY);
                    var width = Math.abs(currentX - startX);
                    var height = Math.abs(currentY - startY);

                    rubberband.style.left = left + 'px';
                    rubberband.style.top = top + 'px';
                    rubberband.style.width = width + 'px';
                    rubberband.style.height = height + 'px';
                };

                canvas.onpointerup = function(e) {
                    if (!isDragging) return;
                    isDragging = false;
                    rubberband.style.display = 'none';

                    var rect = canvas.getBoundingClientRect();
                    var currentX = e.clientX - rect.left;
                    var currentY = e.clientY - rect.top;

                    var left = Math.min(startX, currentX);
                    var top = Math.min(startY, currentY);
                    var width = Math.abs(currentX - startX);
                    var height = Math.abs(currentY - startY);

                    if (width < 15 || height < 15) return;

                    var pctX = Math.round((left / rect.width) * 100);
                    var pctY = Math.round((top / rect.height) * 100);
                    var pctW = Math.round((width / rect.width) * 100);
                    var pctH = Math.round((height / rect.height) * 100);

                    pendingDrawnSlotCoords = { x: pctX, y: pctY, w: pctW, h: pctH };
                    openAddDrawnCompModal(pendingDrawnSlotCoords);
                };

                initCanvasResizeHandler();
            }

                var fs = document.getElementById('fshelf');

                    var shObj = getShelfObj(sh);

                    fs.appendChild(o);
                });
                var activeSh = fs.value || getShelfObj(structRegistry.shelves[0]).name;

                var fco = document.getElementById('fcomp');
                fco.innerHTML = '';
                var comps = (structRegistry.compartments[activeSh] || [{ name: 'Compartment A', shape: 'rect-h' }]).filter(function(c) {
                    var cName = (typeof c === 'string' ? c : (c.name || '')).toLowerCase().trim();
                    return cName.indexOf('slot ') !== 0 && cName.indexOf('box ') !== 0;
                });
                if (comps.length === 0) comps = [{ name: 'Compartment A', shape: 'rect-h' }];
                comps.forEach(function(co) {
                    var coObj = getCompObj(co);
                    var o = document.createElement('option');
                    o.value = coObj.name;
                    o.textContent = coObj.name;
                    if (coObj.name.toLowerCase() === (coVal || '').toLowerCase()) o.selected = true;
                    fco.appendChild(o);
                });
                var activeCo = fco.value || getCompObj(comps[0]).name;

                var fb = document.getElementById('fbox');
                fb.innerHTML = '';
                var bKey = (activeSh + '->' + cleanCompNameJS(activeCo)).toLowerCase();
                var rawBoxes = structRegistry.boxes[bKey] || [];
                if (rawBoxes.length === 0) {
                    var bNames = [];
                    items.forEach(function(it) {
                        if (it.shelf.toLowerCase() === activeSh.toLowerCase() && it.compartment.toLowerCase() === activeCo.toLowerCase()) {
                            if (it.box && bNames.indexOf(it.box) === -1) bNames.push(it.box);
                        }
                    });
                    rawBoxes = bNames.map(function(bn) { return { name: bn, w: 22, l: 15 }; });
                }

                rawBoxes.forEach(function(bRaw) {
                    var bObj = getBoxObj(bRaw);
                    var o = document.createElement('option');
                    o.value = bObj.name;
                    o.textContent = bObj.name;
                    if (bObj.name.toLowerCase() === (bxVal || '').toLowerCase()) o.selected = true;
                    fb.appendChild(o);
                });
                var activeBx = fb.value || (rawBoxes[0] ? (typeof rawBoxes[0] === 'string' ? rawBoxes[0] : rawBoxes[0].name) : '');

                var fsl = document.getElementById('fsl');
                fsl.innerHTML = '';
                var sKey = (activeSh + '->' + cleanCompNameJS(activeCo) + '->' + activeBx).toLowerCase();
                var rawSlots = structRegistry.slots[sKey] || [];
                if (rawSlots.length === 0) {
                    var sNames = [];
                    items.forEach(function(it) {
                        if (it.shelf.toLowerCase() === activeSh.toLowerCase() && it.compartment.toLowerCase() === activeCo.toLowerCase() && (it.box || '').toLowerCase() === activeBx.toLowerCase()) {
                            if (it.slot && sNames.indexOf(it.slot) === -1) sNames.push(it.slot);
                        }
                    });
                    if (sNames.length === 0) {
                        for (var sNum = 1; sNum <= 33; sNum++) sNames.push('Slot ' + sNum);
                    }
                    rawSlots = sNames.map(function(sn) { return { name: sn }; });
                }

                rawSlots.forEach(function(sRaw) {
                    var sObj = getSlotObj(sRaw);
                    var o = document.createElement('option');
                    o.value = sObj.name;
                    o.textContent = sObj.name;
                    if (sObj.name.toLowerCase() === (slVal || '').toLowerCase()) o.selected = true;
                    fsl.appendChild(o);
                });
            }

            window.saveItem = function () {
                var name = document.getElementById('fn').value.trim();
                if (!name) { toast('âš ï¸ Item Name required'); return; }

                var cat = document.getElementById('fc').value;
                var qty = parseInt(document.getElementById('fq').value, 10) || 1;
                var isSmart = !document.getElementById('fns').checked;
                var isReturnable = document.getElementById('fret').checked;
                var shelf = document.getElementById('fshelf').value || 'Shelf 1';
                var comp = document.getElementById('fcomp').value || 'Compartment A';
                var box = document.getElementById('fbox').value || 'Box 1';
                var slot = document.getElementById('fsl').value || 'Slot 1';

                var boxNumMatch = box.match(/\d+/);
                var boxNum = boxNumMatch ? parseInt(boxNumMatch[0], 10) : 1;
                var slotNumMatch = slot.match(/\d+/);
                var subBox = slotNumMatch ? parseInt(slotNumMatch[0], 10) : 1;

                var boxSpec = getBoxSpecFromData(boxNum);
                var calcRow = Math.floor((subBox - 1) / boxSpec.cols) + 1;
                var calcCol = ((subBox - 1) % boxSpec.cols) + 1;

                var newItemId = editingItemId || (items.length > 0 ? Math.max.apply(Math, items.map(function (i) { return i.id; })) + 1 : 1);

                var payload = {
                    id: newItemId,
                    name: name,
                    category: cat,
                    quantity: qty,
                    isSmart: isSmart,
                    isReturnable: isReturnable,
                    shelf: shelf,
                    compartment: comp,
                    box: box,
                    boxNum: boxNum,
                    slot: slot,
                    subBox: subBox,
                    row: isSmart ? calcRow : 0,
                    col: isSmart ? calcCol : 0
                };

                toast('⏳ Saving item to Cloud...');
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                }).then(function () {
                    toast('✅ Item saved to Cloud');
                    closeAddEditModal();
                    setTimeout(fetchInventory, 1200);
                }).catch(function() {
                    toast('✅ Item saved');
                    closeAddEditModal();
                    setTimeout(fetchInventory, 1200);
                });
            };

            window.syncToCloud = function() {
                // Browser POSTs directly to Cloud -- no ESP memory limit.
                // Works for 400+ items. ESP /sync endpoint is no longer used.
                var itemCount = items.length;
                showSyncOverlay('☁️ Syncing ' + itemCount + ' items to Cloud...\nPlease keep this page open (~10–20 seconds).');

                        borrower: item.borrower || '', returnDate: item.returnDate || '',
                        borrowedQty: item.borrowedQty || 0
                    };
                });

                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: minItems, structure: structRegistry }),
                    redirect: 'follow'

                var item = locateItemData;
                var borrower = '';
                var retDate = '';

                if (item.isReturnable) {
                    borrower = document.getElementById('borrowerNameInput').value.trim();
                    retDate = document.getElementById('returnDateInput').value;
                    if (!borrower || !retDate) { toast('⚠️ Borrower name & return date required'); return; }
                }

                item.quantity -= taken;
                if (item.isReturnable) {
                    item.borrower = borrower;
                    item.returnDate = retDate;
                    item.borrowedQty = (Number(item.borrowedQty) || 0) + taken;
                }

                toast('ðŸ“ Picked: ' + taken + 'x ' + item.name);
                closeLocateModal();
                render();
            };

            window.returnItem = function (id) {
                var item = items.find(function (i) { return i.id === id; });
                if (!item || !confirm('Return "' + item.name + '" from ' + item.borrower + '?')) return;

                item.quantity += (item.borrowedQty || 1);
                item.borrower = '';
                item.returnDate = '';
                item.borrowedQty = 0;

                fetch('/inventory', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(item)
                }).then(function () {
                    toast('✅ Returned: ' + item.name);
                    render();
                });
            };



            window.onSearchInput = function (val) {
                srch = val.trim().toLowerCase();
                var ac = document.getElementById('ac');
                if (!srch) {
                    ac.style.display = 'none';
                    renderMainPage();
                    return;
                }

                var matches = items.filter(function (i) {
                    return i.name.toLowerCase().indexOf(srch) !== -1 || i.category.toLowerCase().indexOf(srch) !== -1;
                }).slice(0, 7);

                if (matches.length > 0) {
                    ac.innerHTML = '';
                    matches.forEach(function (m) {
                        var d = document.createElement('div');
                        d.className = 'ac-item';
                        d.textContent = m.name + ' — ' + m.shelf + ' ➔ ' + m.box;
                        d.onclick = function () {
                            document.getElementById('si').value = m.name;
                            srch = m.name.toLowerCase();
                            ac.style.display = 'none';
                            activeId = m.id;
                            selectedRackBox = m.boxNum || 1;
                            document.getElementById('rack-box-select').value = selectedRackBox;
                            switchPage('main');
                        };
                        ac.appendChild(d);
                    });
                    ac.style.display = 'block';
                } else {
                    ac.style.display = 'none';
                }

                renderMainPage();
            };

            document.addEventListener('click', function (e) {
                if (!document.getElementById('sw').contains(e.target)) {
                    document.getElementById('ac').style.display = 'none';
                }
            });

        })();
    </script>
</body>

</html>
